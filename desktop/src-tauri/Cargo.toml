[package]
name = "app"
version = "0.1.0"
description = "Edge Connector desktop host"
authors = ["FLAMOX365"]
license = "MIT"
repository = "https://github.com/FLAMOX365/flamox-edge-connector"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["sync", "time"] }
