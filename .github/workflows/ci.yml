name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Install locked dependencies
        run: deno install --frozen

      - name: Check formatting
        run: deno task fmt

      - name: Lint
        run: deno task lint

      - name: Type-check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Audit dependencies
        run: deno task audit

      - name: Verify generated API models
        run: deno task verify:generated

      - name: Build container
        run: docker build --tag edge-connector:verify .
