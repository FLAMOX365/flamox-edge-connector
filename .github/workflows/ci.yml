name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install package manager
        run: |
          # Replace the preinstalled Yarn Classic shims on hosted runners.
          npm install --global --force corepack@0.36.0
          corepack enable
      - run: yarn install --immutable
      - name: Linux sandbox and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential file librsvg2-dev patchelf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Provision Windows sandbox account and WFP rules
        if: runner.os == 'Windows'
        run: yarn exec srt windows-install
      - name: Test Dependabot automation
        run: node --test .github/scripts/*Dependabot*.spec.mjs
      - run: yarn fmt
      - run: yarn lint
      - run: yarn check
      - name: Diagnose Windows sandbox bootstrap with a fixture
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          yarn build
          trap 'git restore -- runtime/extension-host.ts runtime/extension-sandbox.ts' EXIT
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replace(file, before, after) {
            const source = readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error('Missing diagnostic target: ' + file);
            writeFileSync(file, source.replace(before, after));
          }
          const host = 'runtime/extension-host.ts';
          replace(host, '["ignore", "ignore", "ignore", "ipc"]', '["ignore", "ignore", "inherit", "ipc"]');
          replace(host, 'startupTimeoutMs ?? 10_000', 'startupTimeoutMs ?? 150_000');
          const supervisor = 'runtime/extension-sandbox.ts';
          replace(supervisor, 'await SandboxManager.initialize(', 'console.error("fixture: initializing sandbox");\n  await SandboxManager.initialize(');
          replace(supervisor, 'if (!SandboxManager.isSandboxingEnabled())', 'console.error("fixture: sandbox initialized");\n  if (!SandboxManager.isSandboxingEnabled())');
          replace(supervisor, 'child = spawn(file', 'console.error("fixture: starting broker");\n  child = spawn(file');
          const manager = 'node_modules/@anthropic-ai/sandbox-runtime/dist/sandbox/sandbox-manager.js';
          replace(manager, 'grantWindowsAcl({', 'console.error("fixture: granting ACLs");\n                grantWindowsAcl({');
          replace(manager, 'stampWindowsAcl({', 'console.error("fixture: stamping ACLs");\n                stampWindowsAcl({');
          JS
          node --import tsx --test --test-name-pattern='executes a declared action with scoped configuration' runtime/extension-host.spec.ts
      - run: yarn test:coverage
        timeout-minutes: 6
      - run: yarn check:templates
      - run: yarn verify:generated
      - name: Test native desktop protocol and lifecycle
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          yarn test:native
      - name: Compile native desktop host without publishing
        run: yarn desktop:build --no-bundle
      - name: Build container
        if: runner.os == 'Linux'
        run: docker build --tag edge-connector:verify .
      - name: Audit runtime dependencies
        if: always()
        run: yarn audit

  verify:
    name: Verify
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
