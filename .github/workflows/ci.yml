name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install package manager
        run: |
          # Replace the preinstalled Yarn Classic shims on hosted runners.
          npm install --global --force corepack@0.36.0
          corepack enable
      - run: yarn install --immutable
      - name: Linux sandbox and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential file librsvg2-dev patchelf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Provision Windows sandbox account and WFP rules
        if: runner.os == 'Windows'
        run: yarn exec srt windows-install --skip-profile-grant
      - name: Test Dependabot automation
        run: node --test .github/scripts/*Dependabot*.spec.mjs
      - run: yarn fmt
      - run: yarn lint
      - run: yarn check
      - name: Measure Windows broker startup on a single fixture
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          yarn build
          trap 'git restore -- runtime/extension-host.ts' EXIT
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'runtime/extension-host.ts';
          const source = readFileSync(path, 'utf8');
          if (!source.includes('startupTimeoutMs ?? 10_000')) throw new Error('Missing timeout target');
          writeFileSync(path, source.replace('startupTimeoutMs ?? 10_000', 'startupTimeoutMs ?? 160_000'));
          JS
          node --import tsx --test --test-name-pattern='executes a declared action with scoped configuration' runtime/extension-host.spec.ts
      - run: yarn test:coverage
        timeout-minutes: 6
      - run: yarn check:templates
      - run: yarn verify:generated
      - name: Test native desktop protocol and lifecycle
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          yarn test:native
      - name: Compile native desktop host without publishing
        run: yarn desktop:build --no-bundle
      - name: Build container
        if: runner.os == 'Linux'
        run: docker build --tag edge-connector:verify .
      - name: Audit runtime dependencies
        if: always()
        run: yarn audit

  verify:
    name: Verify
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
