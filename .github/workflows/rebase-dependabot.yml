name: Refresh Dependabot updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase:
    if: >-
      ${{ github.repository_id == '1317851991' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No dependency installation, PR checkout, cache or artifact promotion.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Update Dependabot branches and request their exact CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/rebaseDependabotPullRequests.mjs
